name: JMR V2 · publicar MELI R10 desde libro verificado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jmr-v2-publicar-meli-r10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jmr-v2-publicacion-meli-r10
  cancel-in-progress: false
jobs:
  publicar-meli-r10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout biblioteca de producción
        uses: actions/checkout@v4
        with:
          path: datos
          persist-credentials: true
      - name: Checkout motor oficial congelado JMR V2
        uses: actions/checkout@v4
        with:
          repository: JuanMaRobledo/Modelo-JMR-V2
          ref: ccr-96b8e90f-99c7oc
          path: motor
          persist-credentials: false
      - name: Node.js 22 y Python 3.12
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del render PDF y gráficos
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 weasyprint pymupdf pillow matplotlib numpy
      - name: Preparar MELI R10 y preservar toda la biblioteca de origen
        shell: bash
        run: |
          set -euo pipefail
          python datos/scripts/meli_r10_publicar.py prepare --repo datos --stage "$RUNNER_TEMP/meli-r10"
      - name: Contrastar los tres escenarios y las cuatro sensibilidades 5x5 con el motor de la app
        shell: bash
        run: |
          set -euo pipefail
          node datos/scripts/meli_r10_validar.mjs "$RUNNER_TEMP/meli-r10" motor
      - name: Actualizar gráficos de proyección y sensibilidad R10
        shell: bash
        run: |
          set -euo pipefail
          python datos/scripts/meli_r10_graficos.py "$RUNNER_TEMP/meli-r10"
          mkdir -p datos/jmr-v2/imagenes/MELI-R10
          cp "$RUNNER_TEMP"/meli-r10/imagenes/*.png datos/jmr-v2/imagenes/MELI-R10/
      - name: Rehacer informe PDF sin perder los 14 capítulos
        working-directory: motor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v2-render-homologados.py "$GITHUB_WORKSPACE/datos" "$RUNNER_TEMP/meli-r10/render"
      - name: Validar informe PDF, cerrar expediente y preparar archivos de publicación
        shell: bash
        run: |
          set -euo pipefail
          python datos/scripts/meli_r10_publicar.py finish --repo datos --stage "$RUNNER_TEMP/meli-r10"
      - name: Exportar catálogo y biblioteca completos con el motor (sin alterar otras empresas)
        shell: bash
        run: |
          set -euo pipefail
          node motor/scripts/exportar-biblioteca.mjs --origen "$RUNNER_TEMP/meli-r10/origen" --datos "$GITHUB_WORKSPACE/datos" --comprimir
      - name: Verificar integridad SHA256 y paridad de contenido R10, sin cambios ajenos
        working-directory: datos
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verificar_biblioteca_v2.mjs
          python - <<'PY'
          import copy,gzip,hashlib,json,pathlib
          root=pathlib.Path("jmr-v2")
          m=json.loads((root/"biblioteca.json").read_text())
          raw=gzip.decompress((root/m["archive"]).read_bytes())
          assert hashlib.sha256(raw).hexdigest()==m["sha256"]
          lib=json.loads(raw);files=lib["files"]
          exp=files["empresas/MELI.json"];doc=files["analisis/MELI.json"]
          assert exp["revision"]["id"]==doc["revision"]=="MELI-V2-LTM20260930-R10"
          assert abs(exp["libro"]["valores"]["base"]-2367.5914843010655)<0.02
          assert abs(exp["libro"]["valores"]["conservador"]-1110.0353123134807)<0.02
          assert abs(exp["libro"]["valores"]["optimista"]-3601.4948815116336)<0.02
          meli=next(x for x in files["catalogo.json"]["empresas"] if x["ticker"]=="MELI")
          assert abs(meli["valorBase"]-2367.5914843010655)/2367.5914843010655<.005
          assert abs(meli["precioMOS"]-1538.9344647956927)<.02
          assert meli["visorAuditoria"]=="pendientes"
          assert "MELI-V2-LTM20260930-R10" in exp["informe"]["pdf"]["ruta"]
          p=pathlib.Path(exp["informe"]["pdf"]["ruta"])
          assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==exp["informe"]["pdf"]["sha256"]
          # Lo no-MELI debe conservarse, salvo el catálogo derivado.
          original=json.loads(gzip.decompress((root/"biblioteca-a588c49d3294c15af27cd854ff178d54fe15d59134db5fdbfc022cf7d79c32b0.json.gz").read_bytes()))
          others=[k for k in original["files"] if k not in {"empresas/MELI.json","analisis/MELI.json","catalogo.json"}]
          assert all(files.get(k)==original["files"][k] for k in others),"Cambio accidental a otra empresa"
          print("PUBLICATION_PREFLIGHT_OK",json.dumps({"revision":exp["revision"]["id"],"base":meli["valorBase"],"mos":meli["precioMOS"],"pdf_sha":exp["informe"]["pdf"]["sha256"],"otrosExpedientesPreservados":len(others),"bibliotecaNueva":m["sha256"]}))
          PY
      - name: Publicar biblioteca y PDF R10 en main solo si todo pasó
        working-directory: datos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jmr-v2-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jmr-v2/biblioteca.json jmr-v2/biblioteca-*.json.gz "jmr-v2/informes/MELI/MELI-V2-LTM20260930-R10_INFORME_FUNDAMENTAL.pdf" jmr-v2/imagenes/MELI-R10/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Sin cambios: R10 ya publicada"
          else
            git commit -m "data(v2): publicar MELI R10 con motor conciliado y PDF actualizado"
            git push origin HEAD:main
          fi
