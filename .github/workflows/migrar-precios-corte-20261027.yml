name: Conciliar precios historicos ADBE ONON
on:
  push:
    branches: ["fix/precios-corte-adbe-onon-20261027"]
    paths:
      - "scripts/migrar_precios_corte_20261027.py"
      - ".github/workflows/migrar-precios-corte-20261027.yml"
permissions:
  contents: write
jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar precondiciones sin escritura
        run: python scripts/migrar_precios_corte_20261027.py
      - name: Aplicar migracion limitada de metadatos
        run: python scripts/migrar_precios_corte_20261027.py --apply
      - name: Validar la migracion y el catalogo
        run: |
          python scripts/migrar_precios_corte_20261027.py
          node scripts/validar_catalogo.cjs
          node scripts/auditar_integridad.cjs
          git diff --check
      - name: Registrar commit de los dos JSON en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valoraciones/ADBE-1789572982820.json valoraciones/ONON-1790595640519.json
          git diff --cached --quiet || git commit -m "Conciliar campos de precio del corte preservando valores legados"
          git push origin HEAD:fix/precios-corte-adbe-onon-20261027
