name: Control JMR de ponderaciones
on:
  pull_request:
    paths:
      - 'valoraciones/**'
      - 'auditorias/ponderaciones-38-2026-10-18.json'
      - 'scripts/auditar_ponderaciones.cjs'
      - 'scripts/validar_catalogo.cjs'
      - 'scripts/inventariar_cobertura_a.cjs'
      - 'scripts/tests/validar_matrices_nativas.test.cjs'
      - 'catalogo.json'
      - 'analisis/**'
      - 'auditorias/**'
      - 'scripts/auditar_integridad.cjs'
      - 'scripts/verificar_cierre_multiplos.py'
      - 'evidencia/cierre-siete-multiplos-20261023/**'
      - 'scripts/tests/**'
      - '.github/workflows/auditar-ponderaciones.yml'
  push:
    branches: [main]
    paths:
      - 'valoraciones/**'
      - 'scripts/auditar_ponderaciones.cjs'
      - 'scripts/validar_catalogo.cjs'
      - 'scripts/inventariar_cobertura_a.cjs'
      - 'scripts/tests/validar_matrices_nativas.test.cjs'
      - 'catalogo.json'
      - 'analisis/**'
      - 'auditorias/**'
      - 'scripts/auditar_integridad.cjs'
      - 'scripts/verificar_cierre_multiplos.py'
      - 'evidencia/cierre-siete-multiplos-20261023/**'
      - 'scripts/tests/**'
      - '.github/workflows/auditar-ponderaciones.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Diagnóstico informativo y sus pruebas ANTES del gate; nunca publica.
      - run: node --test scripts/tests/inventariar_cobertura_a.test.cjs
      - run: node --test scripts/tests/validar_matrices_nativas.test.cjs
      - run: node scripts/inventariar_cobertura_a.cjs
      - run: node scripts/validar_catalogo.cjs
      - run: node scripts/auditar_integridad.cjs
      - run: node --test scripts/tests/*.test.cjs
      - run: python3 scripts/verificar_cierre_multiplos.py

      - run: python3 -m unittest discover -s scripts/tests -p test_reviewed_snapshot_release.py -v

