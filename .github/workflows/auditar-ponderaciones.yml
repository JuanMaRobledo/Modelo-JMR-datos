name: Control JMR de ponderaciones
on:
  pull_request:
    paths:
      - 'valoraciones/**'
      - 'auditorias/ponderaciones-38-2026-10-18.json'
      - 'scripts/auditar_ponderaciones.cjs'
      - 'scripts/auditar_integridad.cjs'
      - 'scripts/tests/**'
      - '.github/workflows/auditar-ponderaciones.yml'
  push:
    branches: [main]
    paths:
      - 'valoraciones/**'
      - 'scripts/auditar_ponderaciones.cjs'
      - 'scripts/auditar_integridad.cjs'
      - 'scripts/tests/**'
      - '.github/workflows/auditar-ponderaciones.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/auditar_ponderaciones.cjs
      - run: node --test scripts/tests/auditar_ponderaciones.test.cjs
