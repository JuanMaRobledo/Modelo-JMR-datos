name: Completar datos generales JMR V2 · candidato documentado
on:
  push:
    branches: ['data/v2-datos-generales-completar-11-20261116']
    paths:
      - 'scripts/v2-completar-datos-generales-11.mjs'
      - '.github/workflows/v2-completar-datos-generales-11.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/v2-datos-generales-completar-11-20261116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar candidato de datos sin alterar DCF
        run: node scripts/v2-completar-datos-generales-11.mjs --aplicar
      - name: Validar biblioteca completa, SHA y catálogo
        run: node scripts/verificar_biblioteca_v2.mjs
      - name: Confirmar patch documental y guardar en rama
        run: |
          git add jmr-v2/biblioteca.json jmr-v2/biblioteca-*.json.gz
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data(v2): entradas FY documentadas para Datos generales'
            git push origin HEAD:data/v2-datos-generales-completar-11-20261116
          fi
