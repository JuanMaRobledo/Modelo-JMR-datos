name: MELI R10 · restauración editorial R8 · construir y verificar publicación
on:
  push:
    branches: [main, editorial/meli-r10-integrar-r8-20261121]
    paths:
      - '.github/workflows/meli-r10-restauracion-r8.yml'
      - 'scripts/meli_r10_republicar_r8.py'
      - 'scripts/meli_r10_pdf_contacto.py'
      - 'jmr-v2/fuentes-editoriales/MELI-R10-20261121.html'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/meli-r10-restauracion-r8.yml'
      - 'scripts/meli_r10_republicar_r8.py'
      - 'scripts/meli_r10_pdf_contacto.py'
      - 'jmr-v2/fuentes-editoriales/MELI-R10-20261121.html'
permissions:
  contents: write
jobs:
  publicar-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout íntegro de biblioteca
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de informe y prueba
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 weasyprint==68.0 pymupdf
      - name: Reescribir solo análisis MELI y generar PDF definitivo de R10
        run: |
          python scripts/meli_r10_republicar_r8.py
      - name: Verificar integridad global de la biblioteca
        run: |
          node scripts/verificar_biblioteca_v2.mjs
      - name: Generar revisión visual de todas las páginas PDF
        run: |
          python scripts/meli_r10_pdf_contacto.py
      - name: Publicar resultados comprobados en la rama editorial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jmr-v2/biblioteca.json jmr-v2/biblioteca-*.json.gz jmr-v2/informes/MELI/MELI-V2-LTM20260930-R10_INFORME_FUNDAMENTAL.pdf jmr-v2/qa/MELI-R10-ED2
          git diff --cached --stat
          git diff --cached --quiet && { echo "SIN_CAMBIOS"; exit 0; }
          git commit -m "data(v2): publicar restauración R8 de MELI R10, 14 capítulos y PDF"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo "RAMA_ACTUALIZADA_CON_VERIFICACION"
