name: Diagnostico de multiples trailing V2
on:
  pull_request:
    paths:
      - 'scripts/diagnosticar_trailing_v2.mjs'
      - '.github/workflows/trailing-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnosticar_trailing_v2.mjs
