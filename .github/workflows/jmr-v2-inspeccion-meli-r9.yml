name: JMR V2 inspeccion MELI R9 (lectura)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jmr-v2-inspeccion-meli-r9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar estructura real del archivo V2 sin modificarlo
        shell: bash
        run: |
          python3 - <<'PY'
          import json, gzip, pathlib
          root=pathlib.Path("jmr-v2")
          m=json.loads((root/"biblioteca.json").read_text())
          b=json.loads(gzip.decompress((root/m["archive"]).read_bytes()))
          files=b.get("files",{})
          print("INSPECT_ROOT",json.dumps({"keys":list(b),"fileCount":len(files),"fileNames":[k for k in files if "MELI" in k or k=="catalogo.json"],"manifest":m},ensure_ascii=False))
          for key in ["empresas/MELI.json","analisis/MELI.json","catalogo.json"]:
            obj=files.get(key)
            if obj is None:
              print("INSPECT_FILE",key,"MISSING")
              continue
            if key=="catalogo.json":
              print("INSPECT_CATALOG",json.dumps({"keys":list(obj) if isinstance(obj,dict) else type(obj).__name__,"meli":[v for v in obj.get("empresas",[]) if v.get("ticker")=="MELI"]},ensure_ascii=False)[:10000])
            elif isinstance(obj,dict):
              def skim(item,depth=0):
                if depth>2:return type(item).__name__
                if isinstance(item,dict):return {k:skim(v,depth+1) for k,v in item.items()}
                if isinstance(item,list):return {"list_len":len(item),"first":skim(item[0],depth+1) if item else None}
                return item if isinstance(item,(str,int,float,bool,type(None))) else type(item).__name__
              print("INSPECT_FILE",key,"KEYS",list(obj))
              for k,v in obj.items():
                if k in ("financials","history","statements","sourceData","blocks","sections","charts","historicos"):
                  print("INSPECT_COMPLEX",key,k,str(skim(v))[:2000])
                else:
                  print("INSPECT_FIELD",key,k,json.dumps(v,ensure_ascii=False)[:850])
          PY
