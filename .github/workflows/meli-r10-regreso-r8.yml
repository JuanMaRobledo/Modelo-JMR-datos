name: MELI R10 · publicar con diseño original R8
on:
  push:
    branches: [fix/meli-r10-restaurar-diseno-r8-nvda-20261121]
    paths:
      - scripts/meli_r10_restaurar_diseno_r8.py
      - scripts/meli_r10_qa_r8.py
      - .github/workflows/meli-r10-regreso-r8.yml
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/meli_r10_restaurar_diseno_r8.py
      - scripts/meli_r10_qa_r8.py
      - .github/workflows/meli-r10-regreso-r8.yml
permissions:
  contents: write
concurrency:
  group: meli-r10-regreso-r8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderer y verificador de PDF
        run: python -m pip install --disable-pip-version-check beautifulsoup4 weasyprint==68.0 pymupdf pillow
      - name: Restaurar diseño y generar PDF
        run: python scripts/meli_r10_restaurar_diseno_r8.py
      - name: Verificar biblioteca y otras 18 empresas
        run: node scripts/verificar_biblioteca_v2.mjs
      - name: Comparar portada, perfil y todas las páginas con R8
        run: python scripts/meli_r10_qa_r8.py
      - name: Publicar solo artefactos verificados en la rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jmr-v2/biblioteca.json jmr-v2/biblioteca-*.json.gz
          git add jmr-v2/informes/MELI/MELI-V2-LTM20260930-R10_INFORME_FUNDAMENTAL.pdf
          git add jmr-v2/informes/MELI/MELI-V2-LTM20260930-R10_INFORME_FUNDAMENTAL.html
          git add jmr-v2/qa/MELI-R10-ED4/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "data(v2): restaurar diseño R8 y cifras R10, PDF verificado"
            git pull --rebase origin ${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
