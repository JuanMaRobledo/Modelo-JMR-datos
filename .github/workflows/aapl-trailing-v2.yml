name: Validar acciones AAPL FY2018 V2
on:
  pull_request:
    paths:
      - 'scripts/completar_aapl_2018_trailing_v2.mjs'
      - '.github/workflows/aapl-trailing-v2.yml'
      - 'jmr-v2/biblioteca.json'
permissions:
  contents: write
jobs:
  verificar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v2-aapl-fy2018-acciones-verificadas-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/completar_aapl_2018_trailing_v2.mjs --aplicar
      - run: node scripts/verificar_biblioteca_v2.mjs
      - run: node scripts/diagnosticar_trailing_v2.mjs
      - name: Adjuntar candidato al PR, no publicar en main
        run: |
          git add jmr-v2/biblioteca.json jmr-v2/biblioteca-*.json.gz
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(v2): añadir shares FY2018 AAPL del 10-K reconciliadas por split"
            git push origin HEAD:codex/v2-aapl-fy2018-acciones-verificadas-20261116
          fi
